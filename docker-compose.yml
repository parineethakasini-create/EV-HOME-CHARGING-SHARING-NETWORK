services:
  db:
    image: timescale/timescaledb-ha:pg16     # PostgreSQL 16 + PostGIS + TimescaleDB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/home/postgres/pgdata/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 15
  mqtt:
    image: eclipse-mosquitto:2
    volumes: ["./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf"]
    ports: ["1883:1883"]
  backend:
    build: ./backend
    env_file: .env
    environment: { MQTT_HOST: mqtt }
    volumes: ["./ml/artifacts:/app/ml_artifacts:ro"]
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_started }
    ports: ["8000:8000"]
  ingest:
    build: ./backend
    command: python -m app.mqtt_ingest
    env_file: .env
    environment: { MQTT_HOST: mqtt }
    depends_on:
      backend: { condition: service_started }
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
